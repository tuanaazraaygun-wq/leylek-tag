# OPS-D7 — KYC document-access stream Nginx example (INACTIVE TEMPLATE ONLY)
#
# NOT automatically deployed. Host patch/reload requires a separate authorized phase
# (OPS-D7-B2I-C+ / B2I host config). Do not copy into live sites-enabled without review.
#
# Purpose: document a sanitized access_log posture for:
#   GET /api/internal/enterprise/kyc/document-access/{grant_id}/stream
# so the opaque grant token never appears in Nginx access logs via $request /
# $request_uri / $uri / $args / $request_body.
#
# Upstreams differ by environment:
#   production public API today: 127.0.0.1:8001 (api.leylektag.com)
#   staging process today:       127.0.0.1:8011 (loopback; no proxy yet)
#
# Readiness markers (grant_redemption_ready / streaming_ready / runtime_wired / …)
# remain false until separately authorized. This template does not enable readiness.
#
# Place log_format in the http {} context. Place location inside the api.leylektag.com
# (or future staging) server block, before the catch-all location /.

# --- http context ---
# log_format kyc_stream_sanitized '$remote_addr - $request_method '
#     'enterprise_kyc_document_access_stream '
#     'status=$status '
#     'rt=$request_time '
#     'urt=$upstream_response_time '
#     'bytes=$body_bytes_sent '
#     'req_id=$http_x_karekod_request_id';
#
# NOTE: intentionally omits $request, $request_uri, $uri, $args, $request_body.

# --- server context (example upstream = production 8001) ---
# location ~ ^/api/internal/enterprise/kyc/document-access/[^/]+/stream$ {
#     access_log /var/log/nginx/leylek-kyc-stream.access.log kyc_stream_sanitized;
#     # error_log may still embed request URI on some upstream failures —
#     # treat residual error_log exposure as a separate follow-up (Option D / B2I-F).
#
#     proxy_pass http://127.0.0.1:8001;
#     proxy_http_version 1.1;
#     proxy_set_header Host $host;
#     proxy_set_header X-Real-IP $remote_addr;
#     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#     proxy_set_header X-Forwarded-Proto $scheme;
#     proxy_set_header Upgrade $http_upgrade;
#     proxy_set_header Connection "upgrade";
# }
#
# For a future staging proxy, swap proxy_pass to http://127.0.0.1:8011 and keep
# the same sanitized access_log format.
